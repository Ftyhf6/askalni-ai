kind = "web"
previewPath = "/"
title = "اسألني AI"
description = "تطبيق ويب عربي مهيأ للهاتف يتيح تجربة استشارة AI وصناعة القصص وتحويلها إلى معاينة فيديو عمودية، مع وضع Demo واضح وحد استخدام مجاني وصفحة Premium تجريبية ودعم PWA أساسي."
version = "1.0.0"
id = "artifacts/esalni-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26043

[services.development]
run = "pnpm --filter @workspace/esalni-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/esalni-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/esalni-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26043"
BASE_PATH = "/"
